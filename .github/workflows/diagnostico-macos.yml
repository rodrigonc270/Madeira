name: Diagnostico macOS Madeira

on:
  workflow_dispatch:

jobs:
  diagnostico:
    runs-on: macos-15

    steps:
      - name: Selecionar Xcode 26.3
        shell: bash
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Verificar ambiente
        shell: bash
        run: |
          echo "=== SISTEMA ==="
          sw_vers

          echo "=== XCODE ==="
          xcodebuild -version

          echo "=== SDK IPHONEOS ==="
          xcrun --sdk iphoneos --show-sdk-version

          echo "=== XCODE INSTALADOS ==="
          ls -d /Applications/Xcode*.app 2>/dev/null || true

          echo "=== FERRAMENTAS ==="
          clang --version
          cmake --version
          ninja --version || true

      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Testar compatibilidade rusage
        shell: bash
        run: |
          CC=clang python3 tests/host/check-rusage-sdk.py
